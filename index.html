<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anurag Keshav</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    #app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .title-overlay { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none; }
    .title-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .title-wrap::before { content: ""; position: absolute; width: 130%; height: 180%; border-radius: 999px; background: rgba(0,0,0,.5); filter: blur(42px); }
    .title { position: relative; margin: 0; color: #fff; font-size: clamp(1.35rem, 7vw, 5.25rem); font-weight: 600; letter-spacing: .18em; line-height: 1.2; text-align: center; white-space: nowrap; text-shadow: 0 0 18px rgba(255,255,255,.25); }
    @media (max-width: 520px) { .title { letter-spacing: .1em; } }
  </style>
</head>
<body>
  <main id="app">
    <div class="title-overlay">
      <div class="title-wrap">
        <h1 class="title">ANURAG KESHAV</h1>
      </div>
    </div>
  </main>
  <script type="module">
    import { Renderer, Program, Mesh, Triangle, Color } from "https://esm.sh/ogl@1.0.11";

    const vertex = `
      attribute vec2 position;
      attribute vec2 uv;
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position, 0.0, 1.0); }
    `;

    const fragment = `
      precision mediump float;
      varying vec2 vUv;
      uniform float iTime; uniform vec3 iResolution;
      uniform float uScale; uniform vec2 uGridMul; uniform float uDigitSize;
      uniform float uScanlineIntensity; uniform float uGlitchAmount;
      uniform float uFlickerAmount; uniform float uNoiseAmp;
      uniform float uChromaticAberration; uniform float uDither;
      uniform float uCurvature; uniform vec3 uTint; uniform vec2 uMouse;
      uniform float uMouseStrength; uniform float uBrightness;
      float time;
      float hash21(vec2 p) { p = fract(p * 234.56); p += dot(p, p + 34.56); return fract(p.x * p.y); }
      float noise(vec2 p) { return sin(p.x * 10.0) * sin(p.y * (3.0 + sin(time * .090909))) + .2; }
      mat2 rotate(float a) { float c = cos(a), s = sin(a); return mat2(c,-s,s,c); }
      float fbm(vec2 p) {
        p *= 1.1; float f = 0.0, amp = .5 * uNoiseAmp;
        f += amp * noise(p); p = rotate(time*.02) * p * 2.0; amp *= .454545;
        f += amp * noise(p); p = rotate(time*.02) * p * 2.0; amp *= .454545;
        return f + amp * noise(rotate(time*.08) * p);
      }
      float pattern(vec2 p, out vec2 q, out vec2 r) {
        q = vec2(fbm(p+vec2(1.0)), fbm(rotate(.1*time)*p+vec2(1.0)));
        r = vec2(fbm(rotate(.1)*q), fbm(q)); return fbm(p+r);
      }
      float digit(vec2 p) {
        vec2 grid = uGridMul * 15.0, s = floor(p*grid)/grid; p *= grid;
        vec2 q, r; float intensity = pattern(s*.1,q,r)*1.3-.03;
        float d = distance(s, uMouse*uScale), influence = exp(-d*8.0)*uMouseStrength*10.0;
        intensity += influence + sin(d*20.0-iTime*5.0)*.1*influence;
        p = fract(p); p *= uDigitSize; float px5=p.x*5.0, py5=(1.0-p.y)*5.0;
        float x=fract(px5), y=fract(py5), i=floor(py5)-2.0, j=floor(px5)-2.0;
        float isOn=step(.1,intensity-(i*i+j*j)*.0625);
        return step(0.0,p.x)*step(p.x,1.0)*step(0.0,p.y)*step(p.y,1.0)*isOn*(.2+y*.8)*(.75+x*.25);
      }
      float onOff(float a,float b,float c) { return step(c,sin(iTime+a*cos(iTime*b)))*uFlickerAmount; }
      float displace(vec2 look) { float y=look.y-mod(iTime*.25,1.0), w=1.0/(1.0+50.0*y*y); return sin(look.y*20.0+iTime)*.0125*onOff(4.0,2.0,.8)*(1.0+cos(iTime*60.0))*w; }
      vec3 getColor(vec2 p) {
        float bar=(step(mod(p.y+time*20.0,1.0),.2)*.4+1.0)*uScanlineIntensity, displacement=displace(p);
        p.x += displacement + displacement*(uGlitchAmount-1.0); float middle=digit(p), off=.002;
        float sum=digit(p+vec2(-off,-off))+digit(p+vec2(0.,-off))+digit(p+vec2(off,-off))+digit(p+vec2(-off,0.))+digit(p)+digit(p+vec2(off,0.))+digit(p+vec2(-off,off))+digit(p+vec2(0.,off))+digit(p+vec2(off,off));
        return vec3(.9)*middle+sum*.1*vec3(1.0)*bar;
      }
      vec2 barrel(vec2 uv) { vec2 c=uv*2.0-1.0; c=(1.0+uCurvature*dot(c,c))*c; return c*.5+.5; }
      void main() {
        time=iTime*.333333; vec2 uv=barrel(vUv), p=uv*uScale; vec3 col=getColor(p);
        vec2 ca=vec2(uChromaticAberration)/iResolution.xy;
        col.r=getColor(p+ca).r; col.b=getColor(p-ca).b; col*=uTint*uBrightness;
        if(uDither>0.0) col+=(hash21(gl_FragCoord.xy)-.5)*(uDither*.003922);
        gl_FragColor=vec4(col,1.0);
      }
    `;

    const container = document.querySelector("#app");
    const renderer = new Renderer({ dpr: Math.min(devicePixelRatio, 2) });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 1);
    const mouse = new Float32Array([.5, .5]);
    const program = new Program(gl, {
      vertex, fragment,
      uniforms: {
        iTime: { value: 0 }, iResolution: { value: new Color(1, 1, 1) },
        uScale: { value: 1.5 }, uGridMul: { value: new Float32Array([2, 1]) },
        uDigitSize: { value: 1.2 }, uScanlineIntensity: { value: 1 },
        uGlitchAmount: { value: 1.2 }, uFlickerAmount: { value: 1 },
        uNoiseAmp: { value: 1 }, uChromaticAberration: { value: 2 },
        uDither: { value: .1 }, uCurvature: { value: .1 },
        uTint: { value: new Color(1, 1, 1) }, uMouse: { value: mouse },
        uMouseStrength: { value: .5 }, uBrightness: { value: 1 }
      }
    });
    const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });
    container.appendChild(gl.canvas);
    const resize = () => { renderer.setSize(container.clientWidth, container.clientHeight); program.uniforms.iResolution.value = new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height); };
    new ResizeObserver(resize).observe(container); resize();
    container.addEventListener("pointermove", (event) => { const r=container.getBoundingClientRect(); mouse[0]=(event.clientX-r.left)/r.width; mouse[1]=1-(event.clientY-r.top)/r.height; });
    const start = performance.now();
    const frame = (now) => { program.uniforms.iTime.value=(now-start)*.001; renderer.render({ scene: mesh }); requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
